services:
  # 1. ChromaDB Vector Store
  vector-db:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: always

  # 2. CareerLens FastAPI Backend
  career-lens:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - vector-db
    environment:
      - CHROMA_HOST=vector-db
      - CHROMA_PORT=8000
      - CHROMA_AUTO_START=false
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./career_lens.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - uploads_data:/app/uploads
    restart: always
    env_file:
      - .env

volumes:
  chroma_data:
  uploads_data: